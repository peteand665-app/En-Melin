:root{
  --teal:#30647C; --teal-d:#244D60; --teal-ink:#142F3C;
  --drip:#557A91; --chalk:#F7FAFB;
  --honey:#E9A21A; --honey-d:#A86C00; --honey-soft:#FCEFD2;
  --bg:#E7EEF2; --surf:#FFFFFF; --surf2:#F1F5F8; --line:#CFDCE4;
  --ink:#15303C; --ink2:#4B6572; --ink3:#7C929D;
  --ok:#2F8A5B; --ok-soft:#DDF2E6; --bad:#C0443C; --bad-soft:#FBE3E1; --warn:#C77A00;
  --r-lg:22px; --r-md:14px; --r-sm:9px;
  --disp:"Comfortaa","Varela Round","Trebuchet MS",system-ui,sans-serif;
  --body:"Commissioner","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --hdr:64px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1F28; --surf:#152C38; --surf2:#1A3442; --line:#2A4B5C;
    --ink:#E6EFF3; --ink2:#A7BDC8; --ink3:#7D96A3;
    --honey-soft:#3A2E12; --ok-soft:#173D2B; --bad-soft:#42201D;
    --teal:#30647C; --teal-d:#244D60;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1F28; --surf:#152C38; --surf2:#1A3442; --line:#2A4B5C;
  --ink:#E6EFF3; --ink2:#A7BDC8; --ink3:#7D96A3;
  --honey-soft:#3A2E12; --ok-soft:#173D2B; --bad-soft:#42201D;
  --teal:#30647C; --teal-d:#244D60;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
h1,h2,h3{font-family:var(--disp);font-weight:700;margin:0;line-height:1.15}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
.num{font-variant-numeric:tabular-nums}

/* ---------- header: the caravan panel ---------- */
.hdr{position:sticky;top:0;z-index:30;height:calc(var(--hdr) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:flex;align-items:center;gap:10px;color:#fff;
  background:
    radial-gradient(circle at 50% 50%,rgba(255,255,255,.42) 0 1.6px,transparent 2.2px) 12px 5px/36px 8px repeat-x,
    radial-gradient(circle at 50% 50%,rgba(0,0,0,.18) 0 1.6px,transparent 2.2px) 12px calc(100% - 3px)/36px 8px repeat-x,
    linear-gradient(90deg,transparent calc(62% - 1px),rgba(0,0,0,.12) calc(62% - 1px),rgba(0,0,0,.12) 62%,rgba(255,255,255,.12) 62%,rgba(255,255,255,.12) calc(62% + 1px),transparent calc(62% + 1px)),
    var(--teal);
  box-shadow:0 2px 0 var(--teal-d)}
.logo{display:flex;flex-direction:column;line-height:1;font-family:var(--disp);font-weight:700;user-select:none;flex:none;padding-top:2px}
.logo .en{font-size:.78rem;transform:rotate(-6deg);margin:0 0 3px 2px;letter-spacing:.5px}
.logo .mel{font-size:1.6rem;line-height:.95;position:relative;display:flex;align-items:flex-end}
.logo .mel i{font-style:normal;display:inline-block;position:relative;z-index:1}
.logo .mel i:nth-of-type(1){transform:rotate(-5deg)}
.logo .mel i:nth-of-type(2){transform:rotate(4deg) translateY(-3px)}
.logo .mel i:nth-of-type(3){transform:rotate(-3deg) translateY(2px)}
.logo .mel i:nth-of-type(4){transform:rotate(5deg)}
.logo .mel i:nth-of-type(5){transform:rotate(-8deg) translateY(-1px)}
.logo .drip{position:absolute;left:-2px;top:12px;width:22px;height:26px;z-index:0}
.hdr-mid{flex:1;min-width:0;display:flex;justify-content:center}
.switch{position:relative;max-width:320px;width:100%}
.switch select{appearance:none;-webkit-appearance:none;width:100%;height:42px;border-radius:21px;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.14);color:#fff;font-family:var(--disp);font-weight:700;font-size:1rem;padding:0 40px 0 16px;text-overflow:ellipsis}
.switch select option{color:#16373A;background:#fff}
.switch::after{content:"";position:absolute;right:16px;top:50%;width:9px;height:9px;border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.ev-chip{flex:none;max-width:34vw;height:36px;border-radius:18px;padding:0 12px;background:#fff;color:var(--teal-ink);font-weight:600;font-size:.82rem;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.ev-chip .dot{width:9px;height:9px;border-radius:50%;background:var(--ink3);flex:none}
.ev-chip.live .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(47,138,91,.25)}
.ev-chip span{overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){ .logo .en{display:none} .logo .mel{font-size:1.4rem} .ev-chip{max-width:30vw;padding:0 10px} .hdr{gap:8px;padding-left:10px;padding-right:10px} }

main{padding:14px;padding-bottom:calc(110px + env(safe-area-inset-bottom));max-width:1400px;margin:0 auto}

/* ---------- common bits ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-md);font-weight:600;background:var(--surf2);color:var(--ink);border:1.5px solid var(--line);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.honey{background:var(--honey);border-color:var(--honey);color:#2B1C00}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.big{min-height:58px;font-size:1.15rem;border-radius:var(--r-lg);font-family:var(--disp)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.panel{background:var(--surf);border-radius:var(--r-lg);padding:16px;border:1px solid var(--line)}
.panel + .panel{margin-top:14px}
.sec-h{display:flex;align-items:center;gap:10px;margin:22px 4px 10px}
.sec-h:first-child{margin-top:4px}
.tag{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;font-size:.78rem;font-weight:600;background:var(--surf2);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.honey{background:var(--honey-soft);color:var(--honey-d)}
.tag.teal{background:var(--teal);color:#fff}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field > span{font-size:.85rem;color:var(--ink2);font-weight:600}
.inp{height:46px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--surf);padding:0 12px;width:100%;min-width:0}
textarea.inp{height:auto;min-height:92px;padding:10px 12px;resize:vertical}
select.inp{padding-right:8px}
.inp:focus{border-color:var(--teal);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surf);font-weight:600;font-size:.92rem;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip small{font-weight:500;opacity:.8}
.seg{display:flex;background:var(--surf2);border-radius:var(--r-md);padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:10px;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px 6px}
.seg button small{font-weight:500;font-size:.78rem}
.seg button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 0 var(--line),0 0 0 1.5px var(--teal)}
.stepper{display:inline-flex;align-items:center;background:var(--surf2);border-radius:22px;height:44px}
.stepper button{width:44px;height:44px;border-radius:22px;font-size:1.4rem;font-weight:600;color:var(--teal-d)}
.stepper b{min-width:30px;text-align:center;font-size:1.05rem}
.empty{text-align:center;color:var(--ink2);padding:36px 16px}
.empty svg{width:86px;height:86px;opacity:.8;margin-bottom:6px}
.toggle{position:relative;width:52px;height:30px;flex:none}
.toggle input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.toggle i{position:absolute;inset:0;border-radius:15px;background:var(--line);transition:background .15s}
.toggle i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked + i{background:var(--ok)}
.toggle input:checked + i::after{transform:translateX(22px)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}

/* ---------- order screen ---------- */
.order-wrap{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
@media (min-width:900px){ .order-wrap{grid-template-columns:minmax(0,1fr) 360px} .cart-col{position:sticky;top:calc(var(--hdr) + 14px)} .cartbar{display:none !important} }
@media (max-width:899px){ .cart-col{display:none} }
.acc{background:var(--surf);border-radius:var(--r-lg);border:1px solid var(--line);margin-bottom:12px;overflow:hidden}
.acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:62px;text-align:left}
.acc-h .ic{width:40px;height:40px;flex:none}
.acc-h h2{flex:1}
.acc-h .cnt{font-size:.85rem;color:var(--ink2);font-weight:600}
.acc-h .chev{width:12px;height:12px;border-right:3px solid var(--ink3);border-bottom:3px solid var(--ink3);transform:rotate(45deg);transition:transform .25s;margin:0 6px 4px}
.acc.open .acc-h .chev{transform:rotate(225deg);margin-bottom:-4px}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-in{overflow:hidden}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;padding:2px 14px 16px}
@media (max-width:420px){ .tiles{grid-template-columns:1fr 1fr;gap:10px;padding:2px 10px 14px} }
.tile{position:relative;border-radius:var(--r-md);background:var(--surf2);border:1.5px solid transparent;transition:transform .12s,border-color .12s}
.tile:active{transform:scale(.97)}
.tile-main{display:flex;flex-direction:column;align-items:stretch;width:100%;padding:10px 10px 12px;text-align:left}
.tile-art{aspect-ratio:4/3;border-radius:10px;background:var(--surf);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px}
.tile-art svg{width:86%;height:86%}
.tile-art img{width:100%;height:100%;object-fit:cover}
.tile-name{font-weight:700;line-height:1.2;font-size:.98rem}
.tile-price{color:var(--honey-d);font-weight:700;font-size:.92rem;margin-top:3px}
.tile-add{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;background:var(--honey);color:#2B1C00;font-size:1.6rem;font-weight:700;line-height:1;box-shadow:0 2px 0 var(--honey-d)}
.tile-add:active{transform:translateY(2px);box-shadow:none}
.tile.out{opacity:.55}
.tile.out .tile-art::after{content:attr(data-out);position:absolute;left:10px;top:12px;background:var(--bad);color:#fff;font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:8px}
.tile .qbadge{position:absolute;left:8px;top:8px;min-width:28px;height:28px;border-radius:14px;background:var(--teal);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 8px;font-size:.9rem}

.cart{background:var(--surf);border-radius:var(--r-lg);border:1px solid var(--line);display:flex;flex-direction:column;max-height:calc(100vh - var(--hdr) - 28px)}
.cart-h{padding:16px 16px 8px}
.cart-h .inp{margin-top:10px}
.cart-lines{overflow:auto;padding:0 16px;flex:1;min-height:60px}
.cl{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.cl:last-child{border-bottom:0}
.cl .nm{font-weight:700}
.cl .sub{font-size:.84rem;color:var(--ink2);grid-column:1}
.cl .pr{font-weight:700;text-align:right}
.cl .ctl{grid-column:1 / -1;display:flex;align-items:center;gap:8px}
.cl .stepper{height:38px}
.cl .stepper button{width:38px;height:38px;font-size:1.2rem}
.cart-f{padding:14px 16px 16px;border-top:1px solid var(--line)}
.tot{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.tot b{font-family:var(--disp);font-size:2rem}
.cart.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.025)}}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:25;height:64px;border-radius:32px;background:var(--teal-ink);color:#fff;display:flex;align-items:center;gap:12px;padding:0 8px 0 20px;box-shadow:0 8px 24px rgba(10,40,43,.35)}
.cartbar .cnt{min-width:30px;height:30px;border-radius:15px;background:var(--honey);color:#2B1C00;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 8px}
.cartbar .t{flex:1;font-family:var(--disp);font-weight:700;font-size:1.3rem}
.cartbar .btn{min-height:48px;border-radius:24px}
.cartbar.bump{animation:bump .35s}
.fly{position:fixed;z-index:80;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE09A,var(--honey) 55%,var(--honey-d));pointer-events:none;transition:transform .55s cubic-bezier(.45,-0.3,.6,1),opacity .55s;box-shadow:0 0 0 3px rgba(255,255,255,.6)}

/* ---------- sheets / modals ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(9,32,35,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s;perspective:1200px}
.scrim.in{opacity:1}
@media (min-width:700px){ .scrim{align-items:center;padding:24px} }
.sheet{background:var(--surf);width:100%;max-width:560px;max-height:92vh;border-radius:var(--r-lg) var(--r-lg) 0 0;display:flex;flex-direction:column;transform:translateY(40px);transition:transform .28s cubic-bezier(.2,.9,.3,1.2);padding-bottom:env(safe-area-inset-bottom)}
@media (min-width:700px){ .sheet{border-radius:var(--r-lg)} .sheet.wide{max-width:760px} }
.scrim.in .sheet{transform:none}
.sheet.pop{transform:scale(.55) rotateX(22deg);opacity:.2;transition:transform .36s cubic-bezier(.2,.9,.3,1.15),opacity .2s}
.scrim.in .sheet.pop{transform:none;opacity:1}
.sh-h{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.sh-h h2{flex:1}
.sh-x{width:44px;height:44px;border-radius:22px;background:var(--surf2);font-size:1.4rem;line-height:1;color:var(--ink2)}
.sh-b{overflow:auto;padding:4px 16px 16px;flex:1}
.sh-f{padding:12px 16px 16px;border-top:1px solid var(--line);display:flex;gap:10px}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important} }

.prod-hero{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.prod-hero .art{width:112px;height:92px;border-radius:var(--r-md);background:var(--surf2);flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden}
.prod-hero .art svg{width:90%;height:90%}
.prod-hero .art img{width:100%;height:100%;object-fit:cover}
.prod-hero p{margin:4px 0 0;color:var(--ink2);font-size:.92rem}
.lbl{font-size:.85rem;font-weight:700;color:var(--ink2);margin:14px 0 8px}

/* ---------- pay ---------- */
.pay-top{text-align:center;padding:4px 0 12px}
.pay-top .due{font-family:var(--disp);font-size:3rem;font-weight:700;line-height:1}
.notes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.note{min-height:56px;border-radius:var(--r-md);font-weight:700;font-size:1.1rem;background:var(--surf2);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative}
.note.bill{background:#E8F4EA;border-color:#BFDCC6;color:#1F5A33}
.note.exact{background:var(--teal);border-color:var(--teal);color:#fff;font-size:.95rem}
.note .x{position:absolute;right:5px;top:3px;font-size:.72rem;font-weight:700;color:var(--ok)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .note.bill{background:#173D2B;border-color:#24583D;color:#BFE6CC} }
.change{display:flex;justify-content:space-between;align-items:center;border-radius:var(--r-md);padding:14px 16px;background:var(--honey-soft);margin-top:4px}
.change .v{font-family:var(--disp);font-size:2.2rem;font-weight:700}
.change.short{background:var(--bad-soft);color:var(--bad)}
.tend{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;gap:10px}
.tend .inp{max-width:150px;text-align:right;font-weight:700;font-size:1.1rem}

/* ---------- stations ---------- */
.st-head{display:flex;align-items:center;gap:14px;background:var(--teal-ink);color:#fff;border-radius:var(--r-lg);padding:14px 18px;margin-bottom:14px}
.st-head .big{font-family:var(--disp);font-size:2.6rem;font-weight:700;line-height:1}
.st-head .lab{font-size:.9rem;opacity:.85}
.st-head .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff}
.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tk{background:var(--surf);border-radius:var(--r-lg);border:1.5px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.tk.wait{opacity:.6}
.tk-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.tk-no{font-family:var(--disp);font-size:1.7rem;font-weight:700;line-height:1}
.tk-nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-age{font-weight:700;font-variant-numeric:tabular-nums;font-size:.95rem;padding:3px 8px;border-radius:8px;background:var(--surf2)}
.tk-age.warn{background:var(--honey-soft);color:var(--honey-d)}
.tk-age.late{background:var(--bad);color:#fff}
.tk-b{padding:10px 14px;flex:1}
.tk-l{display:flex;gap:10px;padding:6px 0;align-items:baseline}
.tk-l .q{font-family:var(--disp);font-weight:700;font-size:1.25rem;min-width:44px}
.tk-l .d{flex:1}
.tk-l .d small{display:block;color:var(--ink2)}
.tk-l .d .ex{color:var(--teal-d);font-weight:600}
.tk-l .d .nt{color:var(--bad);font-weight:600}
.tk-f{padding:10px 14px 14px;display:flex;gap:8px;align-items:center}
.tk-f .btn{flex:1}
.st-dots{display:flex;gap:5px}
.st-dots span{font-size:.72rem;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--surf2);color:var(--ink3)}
.st-dots span.done{background:var(--ok-soft);color:var(--ok)}
.pcs{font-family:var(--disp);font-size:1.4rem;font-weight:700;color:var(--honey-d)}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ready{background:var(--ok);color:#fff;border-radius:var(--r-lg);padding:16px;text-align:center;display:flex;flex-direction:column;gap:6px;animation:glow 2s ease-in-out 2}
.ready .n{font-family:var(--disp);font-size:3.4rem;font-weight:700;line-height:1}
.ready .who{font-weight:600;min-height:1.4em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ready .btn{background:#fff;color:var(--ok);border-color:#fff;margin-top:4px}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(47,138,91,.25)}}
.prep{display:flex;flex-wrap:wrap;gap:10px}
.prep .p{background:var(--surf);border:1.5px solid var(--line);border-radius:var(--r-md);padding:8px 14px;display:flex;align-items:center;gap:10px}
.prep .p b{font-family:var(--disp);font-size:1.5rem}

/* ---------- stock ---------- */
.stk{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.stk:last-child{border-bottom:0}
.stk .nm{font-weight:700}
.stk .qty{font-family:var(--disp);font-weight:700;font-size:1.2rem;text-align:right}
.bar{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--surf2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:4px}
.stk.low .bar i{background:var(--bad)}
.stk.low .qty{color:var(--bad)}
.stk .acts{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap}
.stk .acts .btn{min-height:38px;padding:0 12px;font-size:.9rem}
.lasts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.lasts div{background:var(--surf2);border-radius:var(--r-md);padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.lasts b{font-family:var(--disp);font-size:1.15rem}
.lasts .z b{color:var(--bad)}

/* ---------- guide ---------- */
.subnav{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav .chip{flex:none}
.recipe{display:grid;grid-template-columns:1fr auto;gap:0 12px}
.recipe div{padding:10px 0;border-bottom:1px dashed var(--line)}
.recipe div:nth-child(even){text-align:right;font-family:var(--disp);font-weight:700}
.steps{counter-reset:s;list-style:none;margin:0;padding:0}
.steps li{counter-increment:s;position:relative;padding:10px 0 10px 46px;border-bottom:1px solid var(--line);max-width:70ch}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:32px;height:32px;border-radius:50%;background:var(--teal);color:#fff;font-family:var(--disp);font-weight:700;display:flex;align-items:center;justify-content:center}
.hotnote{background:var(--honey-soft);border-radius:var(--r-md);padding:12px 14px;margin-top:12px;max-width:70ch}
.check{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.check input{width:26px;height:26px;accent-color:var(--ok);flex:none}
.check.done span{color:var(--ink3);text-decoration:line-through}
.algt{width:100%;border-collapse:collapse;font-size:.9rem}
.algt th,.algt td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center}
.algt th:first-child,.algt td:first-child{text-align:left}
.algt td.y{color:var(--bad);font-weight:700}
.tbl-wrap{overflow-x:auto}

.timers{position:fixed;right:12px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:24;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
@media (min-width:900px){ .timers{bottom:calc(16px + env(safe-area-inset-bottom))} }
.tmr{display:flex;align-items:center;gap:10px;background:var(--surf);border:2px solid var(--teal);border-radius:24px;padding:6px 6px 6px 14px;box-shadow:0 4px 14px rgba(10,40,43,.2);font-weight:600}
.tmr b{font-family:var(--disp);font-size:1.2rem;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.tmr button{width:34px;height:34px;border-radius:17px;background:var(--surf2);font-size:1.1rem}
.tmr.done{border-color:var(--bad);background:var(--bad);color:#fff;animation:shake .6s infinite}
.tmr.done button{background:#fff;color:var(--bad)}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

/* ---------- history ---------- */
.raised{background:var(--teal-ink);color:#fff;border-radius:var(--r-lg);padding:18px 20px;display:flex;align-items:center;gap:16px;position:relative;overflow:hidden}
.raised .v{font-family:var(--disp);font-size:2.5rem;font-weight:700;color:var(--honey);line-height:1}
.raised svg{position:absolute;right:-6px;top:-4px;width:120px;height:90px;opacity:.9}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--surf2);border-radius:var(--r-md);padding:10px 12px}
.stat .v{font-family:var(--disp);font-weight:700;font-size:1.35rem}
.stat .k{font-size:.8rem;color:var(--ink2)}
.stat.hl{background:var(--honey-soft)}
.orow{border-bottom:1px solid var(--line)}

/* BOOT GUARD — its own script, old syntax on purpose, so a parse error in
   the app cannot take it down. Names the step that failed. */
(function(){
  var BUILD='1.3.0';
  window.__boot={step:'parse',done:false,build:BUILD};
  function banner(msg){
    var d=document.getElementById('bootfail');
    if(!d){
      d=document.createElement('div');
      d.id='bootfail';
      d.setAttribute('style','position:fixed;left:0;right:0;top:0;z-index:9999;background:#A93315;'+
        'color:#fff;font:13px/1.45 system-ui,-apple-system,sans-serif;'+
        'padding:calc(10px + env(safe-area-inset-top,0px)) 13px 10px;');
      (document.body||document.documentElement).appendChild(d);
    }
    d.textContent='Εν Μέλιν v'+BUILD+' — '+msg;
  }
  window.__bootFail=banner;
  window.addEventListener('error',function(e){
    banner('startup error at "'+window.__boot.step+'": '+(e.message||e.type));
  });
  window.addEventListener('unhandledrejection',function(e){
    var r=e.reason;banner('unhandled rejection at "'+window.__boot.step+'": '+((r&&r.message)||r));
  });
  setTimeout(function(){
    if(!window.__boot.done) banner('startup stalled at "'+window.__boot.step+'"');
  },9000);
})();
</script>

/* ══════════════════════════════════════════════════════════════════
   STORAGE FACADE — same shape as Smash Me.
   Backends are probed with a real write at startup; the first that works
   is kept: 1. window.storage (inside Claude) 2. IndexedDB 3. localStorage
   4. memory. Reads return null on miss, writes return true/false.
   ══════════════════════════════════════════════════════════════════ */
const store = (function(){
  let backend = 'none', api = null;
  const mem = {};
  const memAPI = {name:'memory',
    async get(k){ return k in mem ? mem[k] : null; }, async set(k, v){ mem[k] = v; return true; },
    async del(k){ delete mem[k]; return true; }, async list(p){ return Object.keys(mem).filter(k => !p || k.startsWith(p)); }};
  const lsAPI = {name:'localStorage',
    async get(k){ const v = localStorage.getItem(k); return v === null ? null : v; },
    async set(k, v){ localStorage.setItem(k, v); return true; },
    async del(k){ localStorage.removeItem(k); return true; },
    async list(p){ return Object.keys(localStorage).filter(k => !p || k.startsWith(p)); }};
  const idbAPI = (function(){
    let dbp = null;
    const open = () => dbp || (dbp = new Promise((res, rej) => {
      const r = indexedDB.open('enmelin', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    }));
    const tx = async (mode, fn) => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction('kv', mode), s = t.objectStore('kv'), q = fn(s);
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      });
    };
    return {name:'IndexedDB',
      async get(k){ const v = await tx('readonly', s => s.get(k)); return v === undefined ? null : v; },
      async set(k, v){ await tx('readwrite', s => s.put(v, k)); return true; },
      async del(k){ await tx('readwrite', s => s.delete(k)); return true; },
      async list(p){ const ks = await tx('readonly', s => s.getAllKeys()); return ks.filter(k => !p || String(k).startsWith(p)); }};
  })();
  /* window.storage throws on a missing key — normalise that away */
  const claudeAPI = {name:'window.storage',
    async get(k){ try { const r = await window.storage.get(k); return r ? r.value : null; } catch(e){ return null; } },
    async set(k, v){ const r = await window.storage.set(k, v); return !!r; },
    async del(k){ try { await window.storage.delete(k); } catch(e){} return true; },
    async list(p){ try { const r = await window.storage.list(p); return r ? r.keys : []; } catch(e){ return []; } }};
  /* a backend that hangs is worse than one that throws — IndexedDB does this on file:// */
  const limit = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timed out')), ms))]);
  async function probe(c){
    try {
      const k = '__probe_' + Date.now();
      return await limit((async () => {
        if (!await c.set(k, '1')) return false;
        const v = await c.get(k); await c.del(k); return v === '1';
      })(), 1500);
    } catch(e){ return false; }
  }
  return {
    get backend(){ return backend; },
    async init(){
      const order = [];
      if (typeof window !== 'undefined' && window.storage) order.push(claudeAPI);
      if (typeof indexedDB !== 'undefined') order.push(idbAPI);
      try { if (typeof localStorage !== 'undefined') order.push(lsAPI); } catch(e){}
      order.push(memAPI);
      for (const c of order) if (await probe(c)){ api = c; backend = c.name; return backend; }
      api = memAPI; backend = 'memory'; return backend;
    },
    async get(k){ return api ? api.get(k) : null; },
    async set(k, v){ try { return api ? await api.set(k, v) : false; } catch(e){ return false; } },
    async del(k){ try { return api ? await api.del(k) : false; } catch(e){ return false; } },
    async list(p){ return api ? api.list(p) : []; },
    async getJSON(k, fb){ const raw = await this.get(k); if (raw == null) return fb; try { return JSON.parse(raw); } catch(e){ return fb; } },
    async setJSON(k, v){ try { return await this.set(k, JSON.stringify(v)); } catch(e){ return false; } }
  };
})();

/* ── writes are debounced and never block the UI; flush() says if they landed ── */
let saveTimer = null, lastSaveOK = true, lastSaveAt = 0, localTimer = null;
function save(){ clearTimeout(saveTimer); stockCache = null; saveTimer = setTimeout(flush, 120); }
async function flush(){
  clearTimeout(saveTimer);
  const jobs = COLLS.map(c => store.setJSON(K[c], S[c]));
  jobs.push(store.setJSON(K.prefs, S.prefs), store.setJSON(K.guide, S.guide), store.setJSON(K.tomb, S.tomb),
    store.setJSON(K.device, DEVICE), store.setJSON(K.local, LOCAL));
  const res = await Promise.allSettled(jobs);
  // never claim success without checking
  lastSaveOK = res.every(r => r.status === 'fulfilled' && r.value !== false);
  if (lastSaveOK) lastSaveAt = Date.now();
  if (S.prefs.autoSync && typeof sync !== 'undefined' && sync.signedIn()) sync.schedulePush();
  return lastSaveOK;
}

/* ── stock: a counted base plus every movement since. Movements only ever
   get added, so two devices selling at once can never overwrite each other. ── */
let stockCache = null;
function stockMap(){
  if (stockCache) return stockCache;
  const m = {};
  for (const it of S.inv) m[it.id] = num(it.base);
  const bt = {};
  for (const it of S.inv) bt[it.id] = it.baseT || 0;
  for (const mv of S.moves) if (mv.inv in m && mv.ts > bt[mv.inv]) m[mv.inv] += mv.d;
  for (const k in m) m[k] = r2(m[k]);
  return (stockCache = m);
}
const qtyOf = it => stockMap()[it.id] ?? 0;
function addMove(inv, d, why, ref){
  if (!d) return;
  S.moves.push(stamp({id:uid('m'), ts:Date.now(), inv, d:r2(d), why, ref:ref || '', dev:DEVICE.id}));
  stockCache = null;
}
/* a count resets the base; the log keeps a zero-weight line showing the difference */
function logCount(it, q){
  const diff = r2(q - qtyOf(it));
  S.moves.push(stamp({id:uid('m'), ts:Date.now() - 2, inv:it.id, d:0, note:diff, why:'count', ref:'', dev:DEVICE.id}));
  setCount(it, q);
}
function setCount(it, q){ it.base = r2(q); it.baseT = Date.now() - 1; stamp(it); stockCache = null; }
/* fold movements older than 45 days into the base; anything at or before
   baseT is ignored, so a device that resurrects them changes nothing */
function compactMoves(){
  if (S.moves.length < 3000) return;
  const cut = Date.now() - 45 * 864e5;
  for (const it of S.inv){
    if ((it.baseT || 0) >= cut) continue;
    let add = 0;
    for (const mv of S.moves) if (mv.inv === it.id && mv.ts > (it.baseT || 0) && mv.ts <= cut) add += mv.d;
    it.base = r2(num(it.base) + add); it.baseT = cut; stamp(it);
  }
  const old = S.moves.filter(m => m.ts <= cut);
  S.moves = S.moves.filter(m => m.ts > cut);
  old.forEach(m => tombstone('moves', m.id));
  stockCache = null;
}

let ignorePop = 0, pendingBack = 0;
function pushNav(kind){
  try {

   /.netlify/functions/board; the screen polls it. No Google sign-in on
   the screen, so any TV browser, kiosk app or tablet can show it.

const firstName = s => String(s || '').trim().split(/\s+/)[0].slice(0, 14);

function boardItems(){
  const ev = curEvent(), now = Date.now();
  const items = [];
  for (const o of S.orders){
    if (now - o.ts > 12 * 3600e3) continue;
    const st = orderStatus(o);
    const live = ev && o.ev === ev.id && (st === 'open' || st === 'ready');
    const s = !live ? 'gone' : st === 'ready' ? 'ready' : 'prep';
    const t = Math.max(o.lastUpdated || 0, o.ts);
    if (s === 'gone' && now - t > 15 * 60e3) continue;
    items.push({id:o.id, no:noOf(o), name:S.prefs.boardNames ? firstName(o.name) : '', s, t, r:s === 'ready' ? readyAt(o) : 0});
  }
  for (const [id, ts] of Object.entries(S.tomb.orders || {})) if (now - ts < 15 * 60e3) items.push({id, no:'', name:'', s:'gone', t:ts, r:0});
  return items;
}

/* ══════════════════════════════════════════════════════════════════
   MERGE — pure functions, tested by tools/test_merge.js
   Newest lastUpdated wins per record; tombstones delete; a later edit
   beats an earlier delete and vice versa. Orders merge field by field.
   ══════════════════════════════════════════════════════════════════ */
const TOMB_DAYS = 30;
function mergeTombs(a, b, now){
  const cutoff = (now || Date.now()) - TOMB_DAYS * 864e5, out = {};
  for (const c of new Set([...Object.keys(a || {}), ...Object.keys(b || {})])){
    const x = (a || {})[c] || {}, y = (b || {})[c] || {}, m = {};
    for (const id of new Set([...Object.keys(x), ...Object.keys(y)])){
      const ts = Math.max(x[id] || 0, y[id] || 0);
      if (ts > cutoff) m[id] = ts;
    }
    out[c] = m;
  }
  return out;
}
function mergeOrder(a, b){
  const newer = (b.lastUpdated || 0) > (a.lastUpdated || 0) ? b : a;
  const o = clone(newer);
  o.st = {}; o.stT = {}; o.seen = {};
  for (const s of new Set([...Object.keys(a.stT || {}), ...Object.keys(b.stT || {}), ...Object.keys(a.st || {}), ...Object.keys(b.st || {})])){
    const ta = (a.stT || {})[s] || 0, tb = (b.stT || {})[s] || 0;
    const src = tb > ta ? b : a;
    o.st[s] = (src.st || {})[s] || 0; o.stT[s] = Math.max(ta, tb);
  }
  for (const s of new Set([...Object.keys(a.seen || {}), ...Object.keys(b.seen || {})]))
    o.seen[s] = Math.max((a.seen || {})[s] || 0, (b.seen || {})[s] || 0);
  const pick = (f, ft) => { const src = (b[ft] || 0) > (a[ft] || 0) ? b : a; o[f] = src[f] || 0; o[ft] = Math.max(a[ft] || 0, b[ft] || 0); };
  pick('col', 'colT');
  pick('void', 'voidT');
  o.voidReason = (o.void ? ((b.voidT || 0) > (a.voidT || 0) ? b : a).voidReason : '') || '';
  o.lastUpdated = Math.max(a.lastUpdated || 0, b.lastUpdated || 0);
  return o;
}
function mergeColl(local, remote, tombs, fieldMerge){
  const by = new Map();
  (local || []).forEach(r => r && r.id && by.set(r.id, r));
  (remote || []).forEach(r => {
    if (!r || !r.id) return;
    const cur = by.get(r.id);
    if (!cur) by.set(r.id, r);
    else if (fieldMerge) by.set(r.id, fieldMerge(cur, r));
    else if ((r.lastUpdated || 0) > (cur.lastUpdated || 0)) by.set(r.id, r);
  });
  const out = [];
  by.forEach((r, id) => {
    const ts = (tombs || {})[id] || 0;
    if (ts && ts >= (r.lastUpdated || 0)) return;   // a later delete beats an earlier edit
    out.push(r);
  });
  return out;
}
/* merge a remote snapshot into state; returns the merged state (pure) */
function mergeState(local, remote, now){
  if (!remote) return local;
  const out = Object.assign({}, local);
  out.tomb = mergeTombs(local.tomb, remote.tomb, now);
  for (const c of COLLS) out[c] = mergeColl(local[c], remote[c], out.tomb[c], c === 'orders' ? mergeOrder : null);
  out.prefs = (remote.prefs && (remote.prefs.lastUpdated || 0) > (local.prefs.lastUpdated || 0)) ? Object.assign({}, local.prefs, remote.prefs) : local.prefs;
  out.guide = (remote.guide && (remote.guide.lastUpdated || 0) > (local.guide.lastUpdated || 0)) ? remote.guide : local.guide;
  return out;
}
/* two devices can each start a quick event before they have synced.
   Keep the earliest; fold later automatic ones into it, silently. */
function dedupeEvents(st){
  const open = st.events.filter(e => !e.closed).sort((a, b) => a.start - b.start);
  if (open.length < 2) return false;
  const keep = open[0];
  let changed = false;
  for (const e of open.slice(1)){
    if (!e.auto) continue;
    for (const o of st.orders) if (o.ev === e.id){ o.ev = keep.id; o.lastUpdated = Date.now(); changed = true; }
    keep.check = Object.assign({}, e.check, keep.check);
    (st.tomb.events = st.tomb.events || {})[e.id] = Date.now();
    st.events = st.events.filter(x => x.id !== e.id);
    changed = true;
  }
  if (changed) keep.lastUpdated = Date.now();
  return changed;
}

/* ══════════════════════════════════════════════════════════════════
   GOOGLE DRIVE SYNC — Smash Me's module, own file name.
   Same OAuth client and one scope (drive.appdata). Pulls on connect,
   pushes ~4s after a change, polls, re-syncs on focus.
   ══════════════════════════════════════════════════════════════════ */
const sync = (function(){
  const CLIENT_ID = '575936474257-v2r0l3h4tqjinpcem4odjjcsiumcu5qv.apps.googleusercontent.com';
  const SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
  const FILE = 'enmelin-sync.json';
  let token = null, tokenExp = 0, client = null, gisPromise = null, fileId = null, pushTimer = null, poll = null, running = null;
  let st = {state:'off', msg:'sy_off', last:0, err:'', user:null};
  const setS = (state, msg, err) => { st = Object.assign({}, st, {state, msg, err:err || ''}); if (view === 'set' || view === 'home') render(); };

  function loadGIS(){
    if (gisPromise) return gisPromise;
    gisPromise = new Promise((res, rej) => {
      if (window.google && google.accounts && google.accounts.oauth2) return res(true);
      const s = document.createElement('script');
      s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
      const to = setTimeout(() => { gisPromise = null; rej(new Error('timed out loading Google sign-in')); }, 9000);
      s.onload = () => { clearTimeout(to); res(true); };
      s.onerror = () => { clearTimeout(to); gisPromise = null; rej(new Error('Google sign-in script blocked or offline')); };
      document.head.appendChild(s);
    });
    return gisPromise;
  }
  async function getToken(interactive){
    if (token && Date.now() < tokenExp - 60000) return token;
    await loadGIS();
    return new Promise((res, rej) => {
      client = google.accounts.oauth2.initTokenClient({
        client_id:CLIENT_ID, scope:SCOPE,
        callback:r => {
          if (r.error) return rej(new Error(r.error));
          token = r.access_token; tokenExp = Date.now() + (r.expires_in || 3600) * 1000;
          store.set('gtoken_hint', '1'); res(token);
        },
        error_callback:e => rej(new Error(e.type || 'sign-in cancelled'))
      });
      client.requestAccessToken({prompt:interactive ? 'consent' : ''});
    });
  }
  const auth = () => ({Authorization:'Bearer ' + token});
  async function whoAmI(){
    try {
      const r = await fetch('https://www.googleapis.com/drive/v3/about?fields=user', {headers:auth()});
      if (!r.ok) return null;
      const j = await r.json();
      return j.user ? {name:j.user.displayName || '', email:j.user.emailAddress || '', photo:j.user.photoLink || ''} : null;
    } catch(e){ return null; }
  }
  async function findFile(){
    if (fileId) return fileId;
    const q = encodeURIComponent(`name='${FILE}'`);
    const r = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`, {headers:auth()});
    if (!r.ok) throw new Error('Drive list failed (' + r.status + ')');
    const j = await r.json();
    return (fileId = (j.files && j.files[0] && j.files[0].id) || null);
  }
  async function download(){
    const id = await findFile();
    if (!id) return null;
    const r = await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`, {headers:auth()});
    if (r.status === 404){ fileId = null; return null; }
    if (!r.ok) throw new Error('Drive read failed (' + r.status + ')');
    return r.json();
  }
  async function upload(payload){
    const body = JSON.stringify(payload);
    const id = await findFile();
    if (id){

        {method:'PATCH', headers:Object.assign(auth(), {'Content-Type':'application/json'}), body});
      if (!r.ok) throw new Error('Drive write failed (' + r.status + ')');
      return true;
    }
    const boundary = '-------enmelin' + Date.now();
    const meta = {name:FILE, parents:['appDataFolder']};
    const multipart = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n` + JSON.stringify(meta) +
      `\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n` + body + `\r\n--${boundary}--`;
    const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
      {method:'POST', headers:Object.assign(auth(), {'Content-Type':'multipart/related; boundary=' + boundary}), body:multipart});

  }

    const p = {app:'en-melin', v:APP_VERSION, device:DEVICE.name || 'unnamed', at:Date.now(), prefs:S.prefs, guide:S.guide, tomb:S.tomb};
    for (const c of COLLS) p[c] = S[c];

  };
  async function run(interactive){
    if (running) return running;
    running = (async () => {
      try {
        setS('busy', 'sy_busy');
        await getToken(interactive);
        if (!st.user){ const u = await whoAmI(); if (u){ st.user = u; DEVICE.account = u.email || u.name; saveLocal(); } }

        await upload(payload());
        await flush();
        st.last = Date.now();

        return true;
      } catch(e){
        const m = String((e && e.message) || e);
        /* a silent renewal that cannot reach a Google session is an expired sign-in, not a broken sync */

      } finally { running = null; }
    })();

  }
  return {
    get status(){ return st; },
    signedIn:() => !!token && Date.now() < tokenExp,
    connect(){ return run(true); },
    now(){ return run(false); },
    disconnect(){
      if (token && window.google && google.accounts && google.accounts.oauth2) try { google.accounts.oauth2.revoke(token); } catch(e){}

      poll = setInterval(() => { if (this.signedIn()) run(false); }, Math.max(.5, num(S.prefs.syncMins) || 1) * 60000);
    },

      if (!await store.get('gtoken_hint')) return;

    }

})();

/* ══════════════════════════════════════════════════════════════════
   WEB PUSH — Smash Me's design. No database: subscriptions are records
   in S.push and travel through Drive sync. The Netlify function exists
   only to hold the VAPID private key.
   ══════════════════════════════════════════════════════════════════ */
const VAPID_PUBLIC = 'BN9HiWP7Z-9k2xvv__LnFc_e5TyuPS7pALR-3HBy5eyL4UduHcRPwMPGDozfRc0bUDg2gN1bIb8gUgSPvZ3pq_Q';

const b64url = s => { const p = '='.repeat((4 - s.length % 4) % 4);
  const raw = atob((s + p).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0))); };

async function pushEnable(station){

  if (isIOS() && !standalone()) throw new Error(t('alerts_note'));

  const perm = await Notification.requestPermission();

/* ===== business logic ===== */
const linePrice = l => r2((l.price + (l.xprice || 0)) * l.qty);
const cartTotal = () => r2(LOCAL.cart.lines.reduce((a, l) => a + linePrice(l), 0));
const cartCount = () => LOCAL.cart.lines.reduce((a, l) => a + l.qty, 0);

function makeLine(pid, sid, qty, extras, note){
  const p = P(pid); if (!p) return null;
  const s = p.sizes.find(z => z.id === sid) || p.sizes[0];
  const xs = (extras || []).map(X).filter(Boolean);
  return {key:[pid, s.id, xs.map(x => x.id).sort().join('+'), (note || '').trim()].join('|'),
    pid, sid:s.id, qty:Math.max(1, qty | 0), pcs:s.pcs || 0, price:num(s.price),
    xprice:r2(xs.reduce((a, x) => a + num(x.price), 0)), extras:xs.map(x => x.id), note:(note || '').trim(),
    label:{el:p.name.el, en:p.name.en}, slabel:{el:s.name.el, en:s.name.en}, xlabel:xs.map(x => ({el:x.name.el, en:x.name.en}))};
}
function addToCart(line){
  const same = LOCAL.cart.lines.find(l => l.key === line.key);
  if (same) same.qty += line.qty; else LOCAL.cart.lines.push(line);
  saveLocal();
}

function usageOf(lines){
  const u = {};
  for (const l of lines){
    const p = P(l.pid);
    for (const k of (p ? p.use : [])){
      const q = k.per === 'pc' ? k.qty * (l.pcs || 0) * l.qty : k.qty * l.qty;
      u[k.inv] = (u[k.inv] || 0) + q;
    }
    for (const xid of l.extras || []){
      const x = X(xid); if (!x) continue;
      for (const k of x.use || []) u[k.inv] = (u[k.inv] || 0) + k.qty * l.qty;
    }
  }
  return u;
}
function applyStock(usage, sign, why, ref){ for (const [id, q] of Object.entries(usage)) if (INV(id)) addMove(id, sign * q, why, ref); }

/* each till numbers its own orders; once a second till has sold in the same
   event, numbers carry a letter (A1, B1) in the order the tills started */
function nextNo(evId){ return 1 + Math.max(0, ...S.orders.filter(o => o.ev === evId && o.dev === DEVICE.id).map(o => o.no || 0)); }
function noOf(o){
  const first = {};
  for (const x of S.orders) if (x.ev === o.ev && (!(x.dev in first) || x.ts < first[x.dev])) first[x.dev] = x.ts;
  const devs = Object.keys(first).sort((a, b) => first[a] - first[b]);
  return devs.length > 1 ? String.fromCharCode(65 + Math.max(0, devs.indexOf(o.dev)) % 26) + o.no : String(o.no);
}
function placeOrder(pay){
  const lines = LOCAL.cart.lines.map(l => Object.assign({}, l));
  if (!lines.length) return null;
  const ev = ensureEvent();
  const need = [...new Set(lines.flatMap(l => stationsFor(P(l.pid))))];
  const now = Date.now();
  const o = stamp({id:uid('o'), no:nextNo(ev.id), ev:ev.id, ts:now, dev:DEVICE.id, name:(LOCAL.cart.name || '').trim(),
    lines, total:cartTotal(), pay, need, st:{}, stT:{}, seen:{}, col:0, colT:0, void:0, voidT:0, voidReason:''});
  need.forEach(s => { o.st[s] = 0; o.stT[s] = now; });
  if (!need.length){ o.col = now; o.colT = now; }
  applyStock(usageOf(lines), -1, 'sale', o.id);
  S.orders.push(o);
  LOCAL.cart = {lines:[], name:''};
  save(); saveLocal(); publishBoard();
  return o;
}
/* undo straight after sending: the order goes, the stock comes back, the cart returns */
function unplaceOrder(o){
  applyStock(usageOf(o.lines), +1, 'undo', o.id);
  remove('orders', o.id);
  LOCAL.cart = {lines:o.lines, name:o.name};
  LOCAL.printQ = (LOCAL.printQ || []).filter(j => j.id !== o.id);
  save(); saveLocal(); publishBoard();
}
function voidOrder(o, reason){
  if (o.void) return;
  o.void = Date.now(); o.voidT = o.void; o.voidReason = reason || ''; stamp(o);
  applyStock(usageOf(o.lines), +1, 'void', o.id);
  save(); publishBoard();
}
function stationDone(o, s, val = true){
  if (!(o.need || []).includes(s)) return;
  const wasReady = orderStatus(o) === 'ready';
  o.st[s] = val ? Date.now() : 0; o.stT[s] = Date.now(); stamp(o);
  if (!wasReady && orderStatus(o) === 'ready') sndReady();
  save(); publishBoard();
}
function collect(o, val = true){
  o.col = val ? Date.now() : 0; o.colT = Date.now(); stamp(o);
  save(); publishBoard();
}
const liveOrders = () => S.orders.filter(o => ['open', 'ready'].includes(orderStatus(o))).sort((a, b) => a.ts - b.ts);
const linesFor = (o, s) => o.lines.filter(l => stationsFor(P(l.pid)).includes(s) || (!P(l.pid) && s === 'top'));
const stationQueue = s => liveOrders().filter(o => (o.need || []).includes(s) && !o.st[s]);

function portionsLeft(p){
  const s = p.sizes[0]; if (!s) return Infinity;
  let min = Infinity;
  for (const k of p.use){
    const it = INV(k.inv); if (!it) continue;
    const per = k.per === 'pc' ? k.qty * (s.pcs || 0) : k.qty;
    if (per > 0) min = Math.min(min, Math.floor(Math.max(0, qtyOf(it)) / per));
  }
  return min;
}
const isLow = it => qtyOf(it) <= it.low;

/* ---- event totals ---- */
function evStats(evId){
  const os = S.orders.filter(o => o.ev === evId);
  const live = os.filter(o => !o.void);
  const s = {orders:live.length, voids:os.length - live.length, cash:0, card:0, free:0, don:0, donCash:0, pcs:0, items:{}};
  for (const o of live){
    const m = o.pay.method;
    if (m === 'cash') s.cash += o.total; else if (m === 'card') s.card += o.total; else s.free++;
    s.don += num(o.pay.donation);
    if (m === 'cash') s.donCash += num(o.pay.donation);
    for (const l of o.lines){
      s.pcs += (l.pcs || 0) * l.qty;
      const it = s.items[l.pid] = s.items[l.pid] || {label:l.label, qty:0};
      it.qty += l.qty;
    }
  }
  s.cash = r2(s.cash); s.card = r2(s.card); s.don = r2(s.don);
  s.sales = r2(s.cash + s.card);
  s.raised = r2(s.sales + s.don);
  const paid = live.filter(o => o.pay.method !== 'free').length;
  s.avg = paid ? r2(s.sales / paid) : 0;
  const ev = byId('events', evId);
  s.expected = r2(num(ev && ev.float) + s.cash + s.donCash);
  s.top = Object.values(s.items).sort((a, b) => b.qty - a.qty).slice(0, 5);
  return s;
}
const raisedAll = () => r2(S.events.reduce((a, e) => a + evStats(e.id).raised, 0));

function summaryText(ev){
  const s = evStats(ev.id);
  const out = [
    `${S.prefs.team} · ${ev.name}${ev.venue ? ' · ' + ev.venue : ''}`,
    `${dt(ev.start)} ${tm(ev.start)}${ev.closed ? '–' + tm(ev.closed) : ''}`, '',
    `${t('orders')}: ${s.orders}`, `${t('pcs_sold')}: ${s.pcs}`,
    `${t('sales')}: ${eur(s.sales)} (${t('cash_sales')} ${eur(s.cash)}, ${t('card_sales')} ${eur(s.card)})`,
    `${t('donations')}: ${eur(s.don)}`, `${t('raised_total')}: ${eur(s.raised)}`, `${t('free_orders')}: ${s.free}`];
  if (ev.count != null) out.push(`${t('expected_cash')}: ${eur(s.expected)} · ${t('counted')}: ${eur(ev.count)} · ${t('variance')}: ${eur(ev.count - s.expected)}`);
  if (s.top.length){ out.push('', t('top_items') + ':'); s.top.forEach(x => out.push(`  ${x.qty} × ${tx(x.label)}`)); }
  if (ev.volunteers) out.push('', t('volunteers') + ': ' + ev.volunteers);
  if (S.prefs.cause) out.push('', S.prefs.cause);

}

/* ---------- STATIONS ---------- */
function ticketLines(o, s){
  return linesFor(o, s).map(l => {
    const q = s === 'fry' ? `<span class="q pcs">${(l.pcs || 0) * l.qty}</span>` : `<span class="q">${l.qty}×</span>`;
    const sub = s === 'fry' ? `${l.qty} × ${tx(l.slabel)}` : (l.pcs ? `${tx(l.slabel)} · ${l.pcs} ${t('items')}` : tx(l.slabel));
    return `<div class="tk-l">${q}<div class="d"><b>${esc(tx(l.label))}</b><small>${esc(sub)}</small>
      ${s !== 'fry' && l.xlabel.length ? `<small class="ex">${esc(l.xlabel.map(x => '+ ' + tx(x)).join('  '))}</small>` : ''}
      ${l.note ? `<small class="nt">${esc(l.note)}</small>` : ''}</div></div>`;
  }).join('');
}
const ageClass = ts => { const m = (Date.now() - ts) / 60e3; return m > 10 ? 'late' : m > 5 ? 'warn' : ''; };
function vStation(s){
  const q = stationQueue(s);
  let h = '';
  if (s === 'fry'){
    const pcs = q.reduce((a, o) => a + linesFor(o, 'fry').reduce((b, l) => b + (l.pcs || 0) * l.qty, 0), 0);
    h += `<div class="st-head"><div><div class="big num">${pcs}</div><div class="lab">${esc(t('fry_pending'))}</div></div><span class="spacer"></span>
      <button class="btn" type="button" data-act="timer" data-sec="210" data-lab="${esc(t('v_fry'))}">⏱ 3:30</button></div>`;
  } else h += `<div class="st-head"><div><div class="big num">${q.length}</div><div class="lab">${esc(t('v_' + s))}</div></div></div>`;
  if (!q.length) return h + `<div class="empty"><div class="restmark" aria-hidden="true"></div><div>${esc(t('nothing_' + s))}</div></div>`;
  h += '<div class="tickets">';
  for (const o of q){
    const waiting = s === 'top' && o.need.includes('fry') && !o.st.fry;
    const btn = s === 'fry' ? t('fried') : s === 'bar' ? t('given_out') : t('done');
    h += `<div class="tk ${waiting ? 'wait' : ''}"><div class="tk-h"><span class="tk-no">#${noOf(o)}</span><span class="tk-nm">${esc(o.name)}</span>
      <span class="tk-age ${ageClass(o.ts)}" data-since="${o.ts}">${ago(o.ts)}</span></div>
      <div class="tk-b">${ticketLines(o, s)}</div>
      <div class="tk-f">${waiting ? `<span class="tag honey">${esc(t('in_fryer'))}</span>` : ''}
      <button class="btn ok" type="button" data-act="stdone" data-id="${o.id}" data-st="${s}">✓ ${esc(btn)}</button></div></div>`;
  }
  return h + '</div>';
}
const stDots = o => '<span class="st-dots">' + (o.need || []).map(s => `<span class="${o.st[s] ? 'done' : ''}">${esc(t('st_' + s))}</span>`).join('') + '</span>';
function vPass(){
  const act = liveOrders();
  const ready = act.filter(o => orderStatus(o) === 'ready').sort((a, b) => readyAt(a) - readyAt(b));
  const prep = act.filter(o => orderStatus(o) === 'open');
  let h = `<div class="sec-h"><h2>${esc(t('ready_to_collect'))}</h2></div>`;
  h += ready.length ? '<div class="board">' + ready.map(o => `<div class="ready"><div class="n">#${noOf(o)}</div><div class="who">${esc(o.name)}</div>
      <button class="btn" type="button" data-act="collect" data-id="${o.id}">✓ ${esc(t('collected'))}</button></div>`).join('') + '</div>'

/* ---------- STOCK ---------- */
function vStock(){
  const low = S.inv.filter(isLow);
  let h = `<div class="sec-h"><h2>${esc(t('lasts_for'))}</h2></div><div class="panel"><div class="lasts">`;
  for (const p of S.products.filter(x => x.active)){
    const n = portionsLeft(p);
    const lbl = n === Infinity ? '∞' : n;
    h += `<div class="${n <= 0 ? 'z' : ''}"><span>${esc(tx(p.name))}<br><small class="muted">${esc(tx(p.sizes[0].name))}</small></span><b>${lbl}</b></div>`;
  }
  h += `</div></div><div class="sec-h"><h2>${esc(t('v_stock'))}</h2>${low.length ? `<span class="tag bad">${low.length} ${esc(t('stock_low'))}</span>` : `<span class="tag ok">✓</span>`}<span class="spacer"></span>
    <button class="btn" type="button" data-act="inv-new">+ ${esc(t('add_item'))}</button></div><div class="panel">`;
  const sorted = [...S.inv].sort((a, b) => (isLow(b) - isLow(a)) || tx(a.name).localeCompare(tx(b.name), L()));
  for (const it of sorted){
    const q = qtyOf(it);
    const pct = Math.max(0, Math.min(100, it.par ? q / it.par * 100 : 0));
    h += `<div class="stk ${isLow(it) ? 'low' : ''}"><div class="nm">${esc(tx(it.name))}${isLow(it) ? ` <span class="tag bad">${esc(t('stock_low'))}</span>` : ''}</div>
      <div class="qty num">${fmtQty(Math.max(0, q), it.unit)}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="acts">${it.pack && it.pack.qty ? `<button class="btn" type="button" data-act="inv-pack" data-id="${it.id}">+1 ${esc(tx(it.pack.name))}</button>` : ''}
        <button class="btn" type="button" data-act="inv-adj" data-id="${it.id}">${esc(t('restock'))} / ${esc(t('count'))}</button>
        <button class="btn ghost" type="button" data-act="inv-edit" data-id="${it.id}">${esc(t('edit'))}</button></div></div>`;
  }
  h += `</div><div class="sec-h"><h2>${esc(t('moves'))}</h2></div><div class="panel">`;
  const gone = id => id && !byId('orders', id);
  const mv = [...S.moves].sort((a, b) => b.ts - a.ts).filter(m => !gone(m.ref)).slice(0, 40);
  if (!mv.length) h += `<div class="muted">${esc(t('no_moves'))}</div>`;
  for (const m of mv){
    const it = INV(m.inv); if (!it) continue;
    const why = {sale:t('sale'), void:t('void_ret'), manual:t('manual'), count:t('count'), restock:t('restock')}[m.why] || m.why;
    const o = m.ref && byId('orders', m.ref);
    h += `<div class="list-row small"><span class="muted num" style="width:48px">${tm(m.ts)}</span><span style="flex:1">${esc(tx(it.name))}<br><span class="muted">${esc(why)}${o ? ' #' + noOf(o) : ''}</span></span>
      ${(() => { const d = m.why === 'count' ? num(m.note) : m.d; return `<b class="num" style="color:${d < 0 ? 'var(--bad)' : 'var(--ok)'}">${d > 0 ? '+' : ''}${fmtQty(d, it.unit)}</b>`; })()}</div>`;
  }
  return h + '</div>';
}

/* ---------- product pop-out ---------- */
function openProduct(pid, fromEl){
  const p = P(pid); if (!p) return;
  const sel = {sid:p.sizes[0].id, qty:1, extras:new Set(), note:''};
  const al = p.allergens.map(a => ALLERGENS.find(x => x.id === a)).filter(Boolean);
  const body = () => {
    const line = makeLine(p.id, sel.sid, sel.qty, [...sel.extras], sel.note);
    const xs = p.extras.map(X).filter(Boolean);
    return `<div class="prod-hero"><div class="art">${pArt(p)}</div><div><p style="margin:0">${esc(tx(p.desc))}</p>
      ${al.length ? `<div class="chips" style="margin-top:8px">${al.map(a => `<span class="tag bad">${esc(tx(a))}</span>`).join('')}</div>` : ''}</div></div>
      ${p.sizes.length > 1 ? `<div class="lbl">${esc(t('size'))}</div><div class="seg">${p.sizes.map(s => `<button type="button" class="${sel.sid === s.id ? 'on' : ''}" data-ps="${s.id}">${esc(tx(s.name))}<small>${s.pcs ? s.pcs + ' ' + esc(t('items')) + ' · ' : ''}${eur(s.price)}</small></button>`).join('')}</div>` : ''}
      ${xs.length ? `<div class="lbl">${esc(t('extras'))}</div><div class="chips">${xs.map(x => `<button type="button" class="chip ${sel.extras.has(x.id) ? 'on' : ''}" data-px="${x.id}">${esc(tx(x.name))}<small>${num(x.price) ? '+' + eur(x.price) : ''}</small></button>`).join('')}</div>` : ''}
      <div class="lbl">${esc(t('qty'))}</div>
      <div class="row"><span class="stepper"><button type="button" data-pq="-1" aria-label="−">−</button><b>${sel.qty}</b><button type="button" data-pq="1" aria-label="+">+</button></span></div>
      <label class="field" style="margin-top:14px"><span>${esc(t('note'))}</span><input class="inp" data-pn value="${esc(sel.note)}" placeholder="${esc(t('note_ph'))}"></label>
      <div class="list-row"><span style="flex:1">${esc(t('mark_out'))}</span><label class="toggle"><input type="checkbox" data-pout ${p.out ? 'checked' : ''} aria-label="${esc(t('mark_out'))}"><i></i></label></div>
      <div hidden data-total="${linePrice(line)}"></div>`;
  };
  const foot = () => `<button class="btn honey big wide" type="button" data-padd>${esc(t('add_to_order'))} · <span data-pt>${eur(linePrice(makeLine(p.id, sel.sid, sel.qty, [...sel.extras], sel.note)))}</span></button>`;
  const sh = openSheet({title:esc(tx(p.name)), body:body(), foot:foot(), from:fromEl});
  const b = $('.sh-b', sh);
  const repaint = () => { b.innerHTML = body(); $('[data-pt]', sh).textContent = eur(linePrice(makeLine(p.id, sel.sid, sel.qty, [...sel.extras], sel.note))); };
  sh.addEventListener('click', e => {
    const s = e.target.closest('[data-ps]'); if (s){ sel.sid = s.dataset.ps; repaint(); return; }
    const x = e.target.closest('[data-px]'); if (x){ const id = x.dataset.px; sel.extras.has(id) ? sel.extras.delete(id) : sel.extras.add(id); repaint(); return; }
    const q = e.target.closest('[data-pq]'); if (q){ sel.qty = Math.max(1, sel.qty + +q.dataset.pq); repaint(); return; }
    if (e.target.closest('[data-padd]')){
      const line = makeLine(p.id, sel.sid, sel.qty, [...sel.extras], sel.note);
      addToCart(line);
      fly(e.target.closest('[data-padd]'));
      closeSheet();
      refreshCart(true);
      sndTap();
    }
  });
  sh.addEventListener('input', e => { if (e.target.matches('[data-pn]')) sel.note = e.target.value; });
  sh.addEventListener('change', e => {
    if (e.target.matches('[data-pout]')){ const cur = P(p.id); if (cur){ cur.out = e.target.checked; stamp(cur); save(); } if (view === 'order') setTimeout(render, 240); }
  });
}
function quickAdd(pid, fromEl){
  const p = P(pid); if (!p) return;
  addToCart(makeLine(p.id, p.sizes[0].id, 1, [], ''));
  fly(fromEl);
  refreshCart(true);
  sndTap();
}
function fly(fromEl){
  if (!fromEl || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const target = innerWidth >= 900 ? $('#cart .tot b') : $('#cartbar .cnt');
  const r = fromEl.getBoundingClientRect();
  const dot = document.createElement('div');
  dot.className = 'fly';
  dot.style.left = (r.left + r.width / 2 - 13) + 'px';
  dot.style.top = (r.top + r.height / 2 - 13) + 'px';
  document.body.appendChild(dot);
  setTimeout(() => {
    // target may only exist after the cart bar is shown; measure now
    const tEl = innerWidth >= 900 ? $('#cart .tot b') : $('#cartbar .cnt');
    if (!tEl){ dot.remove(); return; }
    const q = tEl.getBoundingClientRect();
    dot.style.transform = `translate(${q.left + q.width / 2 - (r.left + r.width / 2)}px,${q.top + q.height / 2 - (r.top + r.height / 2)}px) scale(.5)`;
    dot.style.opacity = '.3';
  }, 0);
  setTimeout(() => dot.remove(), 620);
}

/* ---------- payment / cash tendering ---------- */
function openPay(){
  if (!LOCAL.cart.lines.length) return;
  const total = cartTotal();
  const P_ = {method:'cash', given:0, notes:{}, keep:false, extra:0, reason:t('r_vol')};
  const DEN = [50, 20, 10, 5, 2, 1, .5];
  const calc = () => {
    const given = r2(P_.given);
    const diff = r2(given - total);
    const change = P_.keep ? 0 : Math.max(0, diff);
    const donation = r2((P_.keep ? Math.max(0, diff) : 0) + num(P_.extra));
    return {given, diff, change, donation};
  };
  const body = () => {
    const c = calc();
    let h = `<div class="pay-top"><div class="muted">${esc(t('total'))}</div><div class="due num">${eur(total)}</div></div>
      <div class="seg">${['cash', 'card', 'free'].map(m => `<button type="button" class="${P_.method === m ? 'on' : ''}" data-pm="${m}">${esc(t(m))}</button>`).join('')}</div>`;
    if (P_.method === 'cash'){
      h += `<div class="notes">
        <button type="button" class="note exact" data-exact>${esc(t('exact'))}</button>
        ${DEN.map(d => `<button type="button" class="note ${d >= 5 ? 'bill' : ''}" data-den="${d}">${eur(d).replace(/[,.]00/, '')}${P_.notes[d] ? `<span class="x">×${P_.notes[d]}</span>` : ''}</button>`).join('')}
      </div>
      <div class="tend"><span class="muted">${esc(t('given'))}</span><span class="spacer"></span>
        <button type="button" class="btn ghost" data-greset>${esc(t('reset_given'))}</button>
        <input class="inp num" data-given inputmode="decimal" value="${P_.given ? String(r2(P_.given)).replace('.', L() === 'el' ? ',' : '.') : ''}" placeholder="${eur(total)}"></div>
      <div class="change ${P_.given && c.diff < 0 ? 'short' : ''}"><span>${esc(P_.given && c.diff < 0 ? t('missing') : t('change'))}</span>
        <span class="v num">${eur(P_.given ? Math.abs(c.diff < 0 ? c.diff : c.change) : 0)}</span></div>
      <div class="list-row"><span style="flex:1">${esc(t('keep_change'))}</span><label class="toggle"><input type="checkbox" data-keep ${P_.keep ? 'checked' : ''} aria-label="${esc(t('keep_change'))}"><i></i></label></div>`;
    }
    if (P_.method === 'free'){
      h += `<div class="lbl">${esc(t('reason'))}</div><div class="chips">${['r_vol', 'r_fam', 'r_sample', 'r_other'].map(k => `<button type="button" class="chip ${P_.reason === t(k) ? 'on' : ''}" data-reason="${esc(t(k))}">${esc(t(k))}</button>`).join('')}</div>`;
    }
    if (P_.method !== 'free'){
      h += `<div class="tend" style="margin-top:12px"><span>${esc(t('extra_don'))}</span><span class="spacer"></span>
        <input class="inp num" data-extra inputmode="decimal" value="${P_.extra ? P_.extra : ''}" placeholder="${eur(0)}"></div>`;
      if (c.donation) h += `<div class="tag honey" style="height:auto;padding:6px 10px">${esc(t('donation'))}: ${eur(c.donation)}</div>`;
    }
    return h;
  };
  const footTxt = () => P_.method === 'cash' ? t('confirm_cash') : P_.method === 'card' ? t('confirm_card') : t('confirm_free');
  const sh = openSheet({title:esc(t('pay')), body:body(), foot:`<button class="btn ok big wide" type="button" data-confirm>${esc(footTxt())}</button>`});
  const b = $('.sh-b', sh);
  const repaint = (keepFocus) => {
    const f = document.activeElement && document.activeElement.dataset ? Object.keys(document.activeElement.dataset)[0] : null;
    b.innerHTML = body();
    const btn = $('[data-confirm]', sh);
    btn.textContent = footTxt();
    const c = calc();
    btn.disabled = P_.method === 'cash' && P_.given > 0 && c.diff < 0;
    if (keepFocus && f){ const el = $(`[data-${f}]`, b); if (el){ el.focus(); const v = el.value; el.value = ''; el.value = v; } }
  };
  sh.addEventListener('click', e => {
    const m = e.target.closest('[data-pm]'); if (m){ P_.method = m.dataset.pm; repaint(); return; }
    if (e.target.closest('[data-exact]')){ P_.given = total; P_.notes = {}; repaint(); sndTap(); return; }
    const d = e.target.closest('[data-den]'); if (d){ const v = +d.dataset.den; P_.given = r2(P_.given + v); P_.notes[v] = (P_.notes[v] || 0) + 1; repaint(); sndTap(); return; }
    if (e.target.closest('[data-greset]')){ P_.given = 0; P_.notes = {}; repaint(); return; }
    const rs = e.target.closest('[data-reason]'); if (rs){ P_.reason = rs.dataset.reason; repaint(); return; }
    if (e.target.closest('[data-confirm]')){
      let c = calc();
      // nothing typed for cash: treat as exact money
      if (P_.method === 'cash' && !P_.given){ P_.given = total; c = calc(); }
      if (P_.method === 'cash' && c.diff < 0) return;
      const pay = {method:P_.method};
      if (P_.method === 'cash'){ pay.given = c.given; pay.change = c.change; }
      if (P_.method === 'free'){ pay.reason = P_.reason; }
      pay.donation = P_.method === 'free' ? 0 : c.donation;
      const o = placeOrder(pay);
      closeSheet();
      if (sheets.length) closeSheet();
      if (!o) return;
      sndNew();
      render();
      setTimeout(() => notifyOrder(o), 0);
      if (DEVICE.printTickets) printTicket(o);
      const msg = `#${noOf(o)} · ${t('sent')}` + (pay.method === 'cash' && pay.change ? ` · ${t('change')} ${eur(pay.change)}` : '');
      toast(msg, () => { unplaceOrder(o); render(); });
    }
  });
  sh.addEventListener('input', e => {
    if (e.target.matches('[data-given]')){ P_.given = num(e.target.value); P_.notes = {}; repaint(true); }
    if (e.target.matches('[data-extra]')){ P_.extra = Math.max(0, num(e.target.value)); repaint(true); }
  });
  sh.addEventListener('change', e => { if (e.target.matches('[data-keep]')){ P_.keep = e.target.checked; repaint(); } });
}

function openCloseTill(evId){
  const ev = byId('events', evId); if (!ev) return;
  const s = evStats(ev.id);
  const DEN = [50, 20, 10, 5, 2, 1, .5, .2, .1, .05];
  const cnt = {}; let typed = '';
  const counted = () => typed !== '' ? num(typed) : r2(DEN.reduce((a, d) => a + d * (cnt[d] || 0), 0));
  const body = () => {
    const c = counted(); const v = r2(c - s.expected);
    return `<div class="stats" style="margin-top:0">
      <div class="stat"><div class="v num">${eur(s.expected)}</div><div class="k">${esc(t('expected_cash'))}</div></div>
      <div class="stat hl"><div class="v num">${eur(c)}</div><div class="k">${esc(t('counted'))}</div></div>
      <div class="stat"><div class="v num ${Math.abs(v) < .01 ? 'var-ok' : 'var-bad'}">${v > 0 ? '+' : ''}${eur(v)}</div><div class="k">${esc(t('variance'))}</div></div></div>
      <div class="lbl">${esc(t('count_cash'))}</div>
      <div class="den">${DEN.map(d => `<span class="lab">${eur(d)}</span><span class="stepper"><button type="button" data-dd="${d}" data-v="-1">−</button><b>${cnt[d] || 0}</b><button type="button" data-dd="${d}" data-v="1">+</button></span><span class="sum num">${eur(d * (cnt[d] || 0))}</span>`).join('')}</div>
      <label class="field" style="margin-top:14px"><span>${esc(t('or_total'))}</span><input class="inp" data-ctotal inputmode="decimal" value="${esc(typed)}"></label>`;
  };
  const sh = openSheet({title:esc(t('close_till')) + ' · ' + esc(ev.name), body:body(), wide:true,
    foot:`<button class="btn honey big wide" type="button" data-cclose>${esc(t('close_event'))}</button>`});
  const b = $('.sh-b', sh);
  sh.addEventListener('click', e => {
    const d = e.target.closest('[data-dd]');
    if (d){ const k = +d.dataset.dd; cnt[k] = Math.max(0, (cnt[k] || 0) + +d.dataset.v); typed = ''; const top = b.scrollTop; b.innerHTML = body(); b.scrollTop = top; return; }
    if (e.target.closest('[data-cclose]')){
      const e2 = byId('events', ev.id) || ev;
      e2.count = counted(); e2.closed = Date.now(); stamp(e2);
      save(); closeSheet();
      LOCAL.ui.eopen = e2.id; render();
      shareText(summaryText(e2));
    }
  });
  sh.addEventListener('input', e => {
    if (e.target.matches('[data-ctotal]')){
      typed = e.target.value;
      const c = counted(); const v = r2(c - s.expected);
      const st = $$('.stat .v', b);
      st[1].textContent = eur(c);
      st[2].textContent = (v > 0 ? '+' : '') + eur(v);
      st[2].className = 'v num ' + (Math.abs(v) < .01 ? 'var-ok' : 'var-bad');
    }
  });
}

function shrinkImage(file, max){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => {
      const k = Math.min(1, max / Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', .8));
    };
    im.onerror = rej;
    im.src = url;
  });
}

    if (scope === 'd'){ DEVICE[k] = el.checked; saveLocal();
      if (k === 'wake' && el.checked) keepAwake();
      if (k === 'wake' && !el.checked && wakeLock){ try { wakeLock.release(); } catch(_){} } }
    if (scope === 's'){ S.prefs.stations[k] = el.checked; stamp(S.prefs); save(); renderHeader(); }
    if (scope === 'p'){
      S.prefs[k] = el.checked;
      if (k === 'board' && el.checked && !S.prefs.boardId){ S.prefs.boardId = randKey(6); S.prefs.boardKey = randKey(24); }
      stamp(S.prefs); save(); sync.startPolling();
      if (k.startsWith('board')){ render(); sendBoard(true); }
    }
  }
  if (el.dataset.pactive){ const p = P(el.dataset.pactive); if (p){ p.active = el.checked; stamp(p); save(); render(); } }
  if (el.dataset.chk){
    const ev = ensureEvent();
    ev.check = Object.assign({}, ev.check, {[el.dataset.chk]:el.checked});
    stamp(ev);
    el.closest('.check').classList.toggle('done', el.checked);
    save(); renderHeader();
  }
  if (el.id === 'restoreFile' && el.files[0]){ importBackup(el.files[0]); el.value = ''; }
});
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches('[data-selectall]')) setTimeout(() => e.target.select(), 0); });
document.addEventListener('focusout', () => { setTimeout(() => { if (pendingRender && !sheets.length && !/INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) render(); }, 50); });

/* ---------- boot: storage first, then independent loads concurrently ---------- */
const step = s => { window.__boot.step = s; };
function bootBanner(failed){
  if (!failed.length) return;
  const d = document.createElement('div');
  d.className = 'panel bootwarn';
  d.innerHTML = `<b>${esc(t('started_problems'))}</b> ${esc(failed.join(', '))}. ${esc(t('other_ok'))}`;
  $('#main').before(d);
}
async function boot(){
  step('storage');
  await store.init();

  /* the ready screen needs no data and no sign-in: it only reads the feed */
  const bid = boardIdFromURL();
  if (bid){
    step('ready screen');
    const dv = await store.getJSON(K.device, null);
    if (dv) DEVICE = Object.assign({}, DEVICE, dv);
    bootBoard(bid);
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('/sw.js').catch(() => {});
    window.__boot.done = true;
    step('idle');
    return;
  }

  step('collections');
  const seed = seedData();
  const cap = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timed out')), ms || 4000))]);
  const names = [...COLLS, 'prefs', 'guide', 'tombstones', 'device', 'local'];
  const keys = [...COLLS.map(c => K[c]), K.prefs, K.guide, K.tomb, K.device, K.local];
  const res = await Promise.allSettled(keys.map(k => cap(store.getJSON(k, null))));
  const val = i => res[i].status === 'fulfilled' ? res[i].value : null;
  const failed = names.filter((_, i) => res[i].status === 'rejected');
  const firstRun = COLLS.every((_, i) => val(i) == null);

  step('state');
  S = {};
  COLLS.forEach((c, i) => S[c] = Array.isArray(val(i)) ? val(i) : seed[c]);
  const n = COLLS.length;
  S.prefs = Object.assign({}, seed.prefs, val(n) || {});
  S.prefs.stations = Object.assign({}, seed.prefs.stations, S.prefs.stations || {});
  S.guide = val(n + 1) || seed.guide;
  S.tomb = val(n + 2) || {};
  DEVICE = Object.assign({}, DEVICE, val(n + 3) || {});
  LOCAL = Object.assign({}, LOCAL, val(n + 4) || {});
  LOCAL.ui = Object.assign({open:['louk'], gtab:'batter', gprod:'classic'}, LOCAL.ui || {});
  LOCAL.cart = Object.assign({lines:[], name:''}, LOCAL.cart || {});
  LOCAL.timers = (LOCAL.timers || []).filter(x => x.end > Date.now() - 60e3);
  LOCAL.printQ = Array.isArray(LOCAL.printQ) ? LOCAL.printQ : [];
  if (!DEVICE.id) DEVICE.id = uid('dev');   // stable per device, needed to own a subscription
  if (!DEVICE.name) DEVICE.name = /iPad|Tablet/i.test(navigator.userAgent) ? 'Tablet' : 'Phone';

  step('migration');
  await migrateV1();

  step('interface');
  applyTheme();
  const q = new URLSearchParams(location.search);
  view = q.get('view') || DEVICE.startView || 'home';
  render();
  bootBanner(failed);
  if (firstRun || failed.length) flush(); else saveLocal();

  step('keep-awake');
  keepAwake();
  document.addEventListener('pointerdown', keepAwake, {once:true});
  $('#homeBtn').addEventListener('click', () => setView('home'));
  $('#evChip').addEventListener('click', () => { const ev = curEvent(); openEventForm(ev ? ev.id : null); });
  $('#cartbar').addEventListener('click', e => { if (e.target.closest('.btn')) openPay(); else openCartSheet(); });
  setInterval(() => {
    $$('[data-since]').forEach(el => {
      const ts = +el.dataset.since;
      el.textContent = ago(ts);
      el.classList.toggle('warn', ageClass(ts) === 'warn');
      el.classList.toggle('late', ageClass(ts) === 'late');
    });
    tickTimers();
  }, 1000);

  step('service worker');
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('/sw.js').catch(() => {});
    navigator.serviceWorker.addEventListener('message', ev => {
      const d = ev.data || {};
      if (d.enmelin === 'open' && d.station) setView(d.station);
      if (d.enmelin === 'push' && sync.signedIn()) sync.now();
    });
  }

  step('printer and screen');
  addEventListener('online', () => { flushPrints(); publishBoard(); });
  setInterval(() => {
    flushPrints();
    // devices at the counter keep the ready screen fresh even if a write was lost
    if (DEVICE.views.includes('pass') || DEVICE.views.includes('order')) sendBoard();
  }, 20000);
  flushPrints(); publishBoard();

  step('sync resume');
  sync.resume().catch(() => {});
  sync.startPolling();

  window.__boot.done = true;
  step('idle');
}
/* v1.0.0 kept everything in one localStorage blob; bring it across once */
async function migrateV1(){
  let old = null;
  try { old = JSON.parse(localStorage.getItem('enmelin.data.v1') || 'null'); } catch(e){}
  if (!old || !old.menu) return;
  const now = Date.now();
  const st = arr => (arr || []).map(r => Object.assign(r, {lastUpdated:now}));
  S.products = st(old.menu.products); S.cats = st(old.menu.cats.map((c, i) => Object.assign(c, {sort:i}))); S.extras = st(old.menu.extras);
  S.inv = st(old.inv.map(x => { const q = x.qty; delete x.qty; return Object.assign(x, {base:q, baseT:now}); }));
  S.moves = [];
  S.events = st(old.events.map(e => { delete e.seq; return e; }));
  S.orders = st(old.orders.map(o => {
    const st2 = {}, stT = {};
    const need = Object.keys(o.st || {});
    need.forEach(s => { st2[s] = o.st[s] ? (o.readyTs || o.ts) : 0; stT[s] = o.ts; });
    return {id:o.id, no:o.no, ev:o.ev, ts:o.ts, dev:DEVICE.id, name:o.name, lines:o.lines, total:o.total, pay:o.pay, need, st:st2, stT, seen:{},
      col:o.status === 'done' ? (o.doneTs || o.ts) : 0, colT:o.ts, void:o.status === 'void' ? (o.voidTs || o.ts) : 0, voidT:o.ts, voidReason:o.voidReason || ''};
  }));
  try {
    const img = JSON.parse(localStorage.getItem('enmelin.img.v1') || '{}') || {};
    S.img = Object.entries(img).map(([id, src]) => ({id, src, lastUpdated:now}));
  } catch(e){}
  S.guide = Object.assign(old.guide || S.guide, {lastUpdated:now});
  const os = old.settings || {};
  S.prefs = Object.assign(S.prefs, {team:os.team || S.prefs.team, cause:os.cause || S.prefs.cause, float:os.float ?? S.prefs.float,
    stations:Object.assign({}, S.prefs.stations, os.stations || {}), lastUpdated:now});
  Object.assign(DEVICE, {lang:os.lang || 'el', theme:os.theme || 'auto', sound:os.sound !== false, vibrate:os.vibrate !== false, wake:os.wake !== false});
  LOCAL.cart = old.cart || LOCAL.cart;
  // only drop the old copy once the new one has landed
  if (await flush()){
    try { localStorage.setItem('enmelin.v1-migrated', localStorage.getItem('enmelin.data.v1')); localStorage.removeItem('enmelin.data.v1'); } catch(e){}
  }
}

boot();
</script>
